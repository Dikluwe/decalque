[package]
name = "decalque-infra"
version.workspace = true
edition.workspace = true

[dependencies]
decalque-core = { path = "../01_core" }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "pnm"] }
lopdf = { version = "0.44", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = "0.11"
turbojpeg-sys = { version = "1.2.0", default-features = false, features = ["cmake"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
crc32fast = "1"
